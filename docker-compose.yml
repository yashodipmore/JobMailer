version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: jobmail_postgres
    environment:
      POSTGRES_DB: jobmail
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
